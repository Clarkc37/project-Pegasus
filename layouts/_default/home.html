{{ define "main" }}
<div x-data="racecardApp" class="home-layout">
  <!-- Festival Banner (conditional) -->
  <div x-show="festivalData.length > 0"
       class="festival-banner rounded-lg p-4 mb-6 bg-white"
       style="border: 1px solid var(--color-cheltenham-gold);">
    <div class="text-center">
      <h2 class="font-heading text-xl font-bold flex items-center justify-center gap-2"
          style="color: var(--color-cheltenham-gold);">
        🏆 <span x-text="festivalTitle || 'Cheltenham Festival 2026'"></span>
      </h2>
      <div class="flex flex-wrap justify-center gap-2 mt-3">
        <a x-for="(day, index) in festivalDays" :key="index"
           :href="'/racecards/festival/#day-' + (index + 1)"
           class="px-3 py-1 text-sm rounded font-body"
           style="background-color: var(--color-cheltenham-gold); color: var(--color-odds-black);">
          Day <span x-text="index + 1"></span>
        </a>
      </div>
    </div>
  </div>

  <!-- Date Navigation (sticky) -->
  <div x-data="dateNav"
       class="sticky top-12 z-10 py-3 mb-4"
       style="background-color: var(--color-racecard-white); border-bottom: 1px solid var(--color-tackroom-taupe);"
       @date-changed.window="fetchData()">
    <div class="flex items-center justify-center space-x-6 font-body text-sm font-medium uppercase tracking-wider">
      <button @click="goYesterday()"
              class="touch-target hover:underline"
              style="color: var(--color-turf-green);">
        ◀ YESTERDAY
      </button>
      <button @click="goToday()"
              class="font-bold touch-target hover:underline"
              :class="{ 'underline': showDate === 'Today' }"
              style="color: var(--color-turf-green);">
        TODAY
      </button>
      <button @click="goTomorrow()"
              class="touch-target hover:underline"
              style="color: var(--color-turf-green);">
        TOMORROW ▶
      </button>
    </div>
    <div class="text-center text-xs mt-1" style="color: var(--color-paddock-grey);">
      <span x-text="selectedDate"></span>
    </div>
  </div>

  <!-- Loading State -->
  <div x-show="loading" class="text-center py-12">
    <div class="animate-pulse text-lg font-body" style="color: var(--color-paddock-grey);">
      Loading racecards…
    </div>
  </div>

  <!-- Error State -->
  <div x-show="!loading && error"
       class="text-center py-12 px-4">
    <p class="font-body text-lg" style="color: var(--color-paddock-grey);">
      No jumps racing scheduled for <span x-text="selectedDate"></span>.
    </p>
    <p class="text-sm mt-2" style="color: var(--color-paddock-grey);">
      Try a different date, or check back for the next fixture.
    </p>
  </div>

  <!-- Main Content: Course Cards + Sidebar -->
  <div x-show="!loading && !error && raceData.length > 0"
       class="grid grid-cols-1 lg:grid-cols-3 lg:gap-6">

    <!-- Course Cards (left 2/3 on desktop) -->
    <div class="lg:col-span-2 space-y-4">
      <template x-for="course in raceData" :key="course.Course || course.course">
        <div class="card rounded-lg p-4 bg-white">
          <div class="flex items-center justify-between mb-3">
            <div>
              <h3 class="font-heading text-lg font-semibold touch-target"
                  style="color: var(--color-turf-green);">
                🏇 <span x-text="course.Course || course.course"></span>
              </h3>
              <p class="text-xs mt-1" style="color: var(--color-paddock-grey);">
                <span x-text="course.Going || course.going || ''"></span>
              </p>
            </div>
          </div>

          <!-- Race list -->
          <div class="space-y-2">
            <template x-for="race in (course.Races || course.races || [])" :key="race.time || race.timeDisplay">
              <a :href="'/racecards/view/?date=' + selectedDate + '&course=' + encodeURIComponent(course.Course || course.course) + '&time=' + encodeURIComponent(race.timeDisplay || race.time)"
                 class="block touch-target rounded px-3 py-2 hover:bg-gray-50"
                 style="border: 1px solid var(--color-tackroom-taupe); border-top: none;">
                <div class="flex justify-between items-center">
                  <div>
                    <span class="font-bold text-sm" style="color: var(--color-odds-black);">
                      <span x-text="race.timeDisplay || race.time || ''"></span>
                    </span>
                    <span class="text-sm ml-2" style="color: var(--color-odds-black);">
                      <span x-text="race.title || race.raceTitle || race.race_title || ''"></span>
                    </span>
                  </div>
                  <div class="flex items-center space-x-3 text-xs" style="color: var(--color-paddock-grey);">
                    <span x-text="race.distance || race.distance_text || ''"></span>
                    <span x-text="(race.runners || race.number_of_runners || 0) + 'rn'"></span>
                  </div>
                </div>
              </a>
            </template>
          </div>
        </div>
      </template>
    </div>

    <!-- Stats Sidebar (right 1/3 desktop, below cards on mobile) -->
    <div class="mt-6 lg:mt-0">
      <div class="card rounded-lg p-4 bg-white">
        <h4 class="font-heading text-base font-bold mb-3 flex items-center gap-2"
            style="color: var(--color-turf-green);">
          📊 Race Stats
        </h4>
        <div class="space-y-4 text-sm font-body">
          <!-- Count of meetings -->
          <div>
            <span style="color: var(--color-paddock-grey);">Meetings today:</span>
            <br /><span class="font-semibold" x-text="raceData.length"></span>
          </div>
          <!-- Top Trainer (stub) -->
          <div>
            <span style="color: var(--color-paddock-grey);">Top Trainer:</span>
            <br /><span class="font-semibold">—</span>
          </div>
          <!-- Best Bet (stub) -->
          <div>
            <span style="color: var(--color-paddock-grey);">Best Bet Today:</span>
            <br /><span class="font-semibold" style="color: var(--color-cheltenham-gold);">—</span>
          </div>
          <!-- Horses to Watch -->
          <div>
            <span style="color: var(--color-paddock-grey);">Total Races:</span>
            <br /><span class="font-semibold" x-text="totalRaceCount"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{{ end }}
