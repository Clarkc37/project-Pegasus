[build]
  command = "npm install && npx @tailwindcss/cli -i assets/css/main.css -o static/css/main.css --minify && hugo --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.165.0"

[context]
  [context.branch-deploy]
    command = "npm install && npx @tailwindcss/cli -i assets/css/main.css -o static/css/main.css --minify && hugo --minify -b $DEPLOY_PRIME_URL"

  [context.deploy-preview]
    command = "npm install && npx @tailwindcss/cli -i assets/css/main.css -o static/css/main.css --minify && hugo --minify -b $DEPLOY_PRIME_URL"

  [context.production]
    [context.production.environment]
      HUGO_ENV = "production"