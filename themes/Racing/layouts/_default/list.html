{{ define "main" }}
<div class="max-w-3xl mx-auto">
  <h1 class="text-3xl font-heading font-bold text-odds-black mb-6">{{ .Title }}</h1>
  {{ .Content }}
  {{ range .Pages }}
  <article class="mb-8 bg-white rounded-lg border border-tackroom-taupe p-6">
    <h2 class="text-xl font-heading font-semibold mb-2">
      <a href="{{ .RelPermalink }}" class="text-turf-green hover:text-turf-green/80 transition-colors">{{ .LinkTitle }}</a>
    </h2>
    {{ .Summary }}
  </article>
  {{ end }}
</div>
{{ end }}
