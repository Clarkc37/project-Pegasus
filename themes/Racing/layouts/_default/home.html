{{ define "main" }}
<div x-data="racecardLoader()" x-init="fetchData()">
  <!-- Festival Banner (conditionally shown) -->
  <div x-data="{
    activeDay: 0,
    festivalData: [],
    festivalLoading: true,
    init() {
      fetch('/data/racecards/cheltenham.json')
        .then(res => res.json())
        .then(data => { this.festivalData = data; this.festivalLoading = false; })
        .catch(() => { this.festivalLoading = false; });
    }
  }" x-init="init()" x-show="!festivalLoading && festivalData.length > 0"
    class="festival-banner rounded-lg overflow-hidden mb-8 bg-white">
    <!-- Header -->
    <div class="bg-turf-green px-6 py-4 text-white flex justify-between items-end">
      <div>
        <h2 class="text-xl font-heading font-bold">🏆 Cheltenham Festival</h2>
        <p class="text-xs opacity-80 mt-1" x-show="!festivalLoading" x-text="festivalData[activeDay]?.date"></p>
      </div>
      <div class="text-right" x-show="!festivalLoading">
        <span class="text-[10px] block opacity-70 uppercase font-bold">Going</span>
        <span class="text-xs font-semibold" x-text="festivalData[activeDay]?.going"></span>
      </div>
    </div>
    <!-- Day Tabs -->
    <div class="flex border-b border-tackroom-taupe">
      <template x-for="(day, index) in festivalData" :key="index">
        <button @click="activeDay = index"
          class="flex-1 py-3 px-2 text-xs md:text-sm font-bold uppercase transition-colors"
          :class="activeDay === index ? 'text-turf-green border-b-2 border-turf-green bg-white' : 'text-paddock-grey hover:text-turf-green hover:bg-gray-50'">
          Day <span x-text="index + 1"></span>
        </button>
      </template>
    </div>
    <!-- Race List -->
    <div class="min-h-[300px]">
      <template x-if="festivalLoading">
        <div class="flex justify-center items-center py-16">
          <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-turf-green"></div>
        </div>
      </template>
      <template x-if="!festivalLoading && festivalData.length > 0">
        <div class="divide-y divide-tackroom-taupe/30">
          <template x-for="race in festivalData[activeDay]?.races" :key="race.race_id">
            <a :href="`/racecards/view?date=${festivalData[activeDay].date}&course=Cheltenham&time=${race.timeDisplay}`"
              class="flex items-center justify-between px-6 py-4 hover:bg-turf-green/5 transition-colors">
              <div class="flex items-start gap-4">
                <span class="font-bold text-lg text-turf-green leading-none pt-1" x-text="race.timeDisplay"></span>
                <div>
                  <p class="font-bold text-odds-black leading-tight mb-1" x-text="race.raceTitle"></p>
                  <div class="flex items-center gap-2 text-[11px] text-paddock-grey font-medium">
                    <span x-text="race.raceDistance"></span>
                    <span>•</span>
                    <span x-text="race.noOfRunners + ' runners'"></span>
                  </div>
                </div>
              </div>
              <svg class="w-5 h-5 text-turf-green opacity-30 group-hover:opacity-100" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
              </svg>
            </a>
          </template>
        </div>
      </template>
    </div>
    <div class="bg-gray-50 px-6 py-3 text-center border-t border-tackroom-taupe/30">
      <a :href="`/racecards/festival?date=${festivalData[activeDay]?.date}`"
        class="text-xs font-bold text-turf-green hover:text-turf-green/80 uppercase tracking-tight">
        View All Day <span x-text="activeDay + 1"></span> Tips →
      </a>
    </div>
  </div>

  <!-- Today's Racing -->
  <div class="mb-6">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
      <h1 class="text-2xl md:text-3xl font-heading font-bold text-odds-black">
        <span x-text="showDate || 'Today'"></span>'s Racing
      </h1>
      <!-- Date Nav -->
      <div x-data="dateNav()" class="flex rounded-lg border border-tackroom-taupe overflow-hidden bg-white">
        <button @click="goYesterday(); $dispatch('date-changed', {date: getDate(-1)})"
          :class="showDate === 'Yesterday' ? 'bg-turf-green text-white' : 'hover:bg-gray-100 text-odds-black'"
          class="px-4 py-2 text-sm font-medium transition-colors">◀ Yesterday</button>
        <button @click="goToday(); $dispatch('date-changed', {date: getDate(0)})"
          :class="showDate === 'Today' ? 'bg-turf-green text-white' : 'hover:bg-gray-100 text-odds-black'"
          class="px-4 py-2 text-sm font-medium transition-colors border-x border-tackroom-taupe">Today</button>
        <button @click="goTomorrow(); $dispatch('date-changed', {date: getDate(1)})"
          :class="showDate === 'Tomorrow' ? 'bg-turf-green text-white' : 'hover:bg-gray-100 text-odds-black'"
          class="px-4 py-2 text-sm font-medium transition-colors">Tomorrow ▶</button>
      </div>
    </div>

    <!-- Loading State -->
    <template x-if="loading">
      <div class="flex flex-col items-center justify-center py-20">
        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-turf-green mb-4"></div>
        <p class="text-paddock-grey text-sm">Loading racecards...</p>
      </div>
    </template>

    <!-- Empty State -->
    <template x-if="!loading && raceData.length === 0">
      <div class="text-center py-16 bg-white rounded-lg border border-tackroom-taupe">
        <p class="text-lg font-heading font-semibold text-odds-black mb-2">No jumps racing scheduled for today</p>
        <p class="text-paddock-grey text-sm">Check back for the next fixture or browse the archive.</p>
      </div>
    </template>

    <!-- Desktop: Course Cards Grid -->
    <div x-show="!loading && raceData.length > 0">
      <!-- Desktop view: grid -->
      <div class="hidden md:grid md:grid-cols-1 gap-4">
        <template x-for="(courseData, index) in raceData" :key="index">
          <div class="bg-white rounded-lg border border-tackroom-taupe overflow-hidden">
            <!-- Course Header -->
            <div class="bg-turf-green px-6 py-3 text-white flex justify-between items-center">
              <div>
                <h2 class="text-lg font-heading font-bold" x-text="courseData.Course"></h2>
                <span class="text-xs opacity-80">Jumps · <span x-text="courseData.races.length"></span> races</span>
              </div>
              <div class="text-xs opacity-80" x-text="courseData.going"></div>
            </div>
            <!-- Races List -->
            <div class="divide-y divide-tackroom-taupe/30">
              <template x-for="race in courseData.races" :key="race.timeDisplay">
                <a :href="`/racecards/view?date=${selectedDate}&course=${courseData.Course}&time=${race.timeDisplay}`"
                  class="flex items-center justify-between px-6 py-3 hover:bg-turf-green/5 transition-colors">
                  <div class="flex items-center gap-4">
                    <span class="font-bold text-turf-green text-lg w-16" x-text="race.timeDisplay"></span>
                    <div>
                      <p class="font-semibold text-odds-black text-sm" x-text="race.raceTitle"></p>
                      <p class="text-xs text-paddock-grey">
                        <span x-text="race.raceDistance"></span>
                        <span x-show="race.raceConditions"> · </span>
                        <span x-text="race.raceConditions"></span>
                      </p>
                    </div>
                  </div>
                  <div class="text-right">
                    <span class="text-xs text-paddock-grey" x-text="race.noOfRunners + ' runners'"></span>
                  </div>
                </a>
              </template>
            </div>
          </div>
        </template>
      </div>

      <!-- Mobile: Accordion view -->
      <div class="block md:hidden space-y-3">
        <template x-for="(courseData, index) in raceData" :key="index">
          <div class="bg-white rounded-lg border border-tackroom-taupe overflow-hidden">
            <button @click="courseData.open = !courseData.open"
              class="w-full px-4 py-3 flex justify-between items-center bg-turf-green text-white touch-target">
              <div class="text-left">
                <span class="font-heading font-bold" x-text="courseData.Course"></span>
                <span class="text-xs opacity-80 block" x-text="courseData.races.length + ' races'"></span>
              </div>
              <svg class="w-5 h-5 transition-transform" :class="{'rotate-180': courseData.open}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </button>
            <div x-show="courseData.open" x-collapse>
              <div class="px-4 py-2 text-xs text-paddock-grey border-b border-tackroom-taupe/30">
                Going: <span class="font-semibold text-odds-black" x-text="courseData.going"></span>
              </div>
              <template x-for="race in courseData.races" :key="race.timeDisplay">
                <a :href="`/racecards/view?date=${selectedDate}&course=${courseData.Course}&time=${race.timeDisplay}`"
                  class="flex items-center justify-between px-4 py-3 border-b border-tackroom-taupe/20 hover:bg-turf-green/5 touch-target">
                  <div>
                    <span class="font-bold text-turf-green text-sm mr-3" x-text="race.timeDisplay"></span>
                    <span class="text-sm text-odds-black" x-text="race.raceTitle"></span>
                  </div>
                  <span class="text-xs text-paddock-grey" x-text="race.noOfRunners + 'rn'"></span>
                </a>
              </template>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>
</div>

<script src="/js/app.js" defer></script>
<script src="/js/date-nav.js" defer></script>
<script src="/js/racecard-loader.js" defer></script>
{{ end }}
