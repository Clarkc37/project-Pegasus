<nav class="bg-turf-green text-white sticky top-0 z-50" x-data="{ open: false }">
  <div class="container mx-auto max-w-7xl px-4">
    <div class="flex justify-between items-center h-14 md:h-16">
      <!-- Logo / Site Title -->
      <a href="{{ .Site.BaseURL }}" class="text-lg md:text-xl font-heading font-bold tracking-tight">
        🏇 {{ .Site.Title }}
      </a>

      <!-- Desktop Nav -->
      <ul class="hidden md:flex space-x-1">
        {{ range .Site.Menus.main }}
        <li>
          <a href="{{ .URL }}"
            class="px-3 py-2 text-sm font-medium rounded hover:bg-white/10 transition-colors
                   {{ if or ($.IsMenuCurrent `main` .) ($.HasMenuCurrent `main` .) }}bg-white/15{{ end }}">
            {{ .Name }}
          </a>
        </li>
        {{ end }}
      </ul>

      <!-- Mobile Hamburger -->
      <button @click="open = !open" class="md:hidden p-2 rounded hover:bg-white/10" aria-label="Toggle menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 6h16M4 12h16m-7 6h7"></path>
        </svg>
      </button>
    </div>

    <!-- Mobile Slide-out -->
    <div x-show="open" @click.away="open = false" x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="opacity-0 -translate-y-2" x-transition:enter-end="opacity-100 translate-y-0"
      class="md:hidden pb-3">
      <ul class="space-y-1">
        {{ range .Site.Menus.main }}
        <li>
          <a href="{{ .URL }}"
            class="block px-3 py-2 text-sm font-medium rounded hover:bg-white/10 transition-colors
                   {{ if or ($.IsMenuCurrent `main` .) ($.HasMenuCurrent `main` .) }}bg-white/15{{ end }}">
            {{ .Name }}
          </a>
        </li>
        {{ end }}
      </ul>
    </div>
  </div>
</nav>
