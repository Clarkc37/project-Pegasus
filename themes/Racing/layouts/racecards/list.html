{{ define "main" }}
<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
  <section class="lg:col-span-2" x-data="racecardLoader()" x-init="fetchData()">
    <h1 class="text-2xl md:text-3xl font-heading font-bold text-odds-black mb-6">Racecards</h1>

    <!-- Date Picker + Nav -->
    <div class="flex flex-wrap items-center gap-4 mb-6">
      <input type="date" x-model="selectedDate" @change="fetchData()"
        class="border border-tackroom-taupe rounded px-3 py-2 text-sm bg-white">
      <div class="flex rounded-lg border border-tackroom-taupe overflow-hidden bg-white">
        <button @click="selectedDate = getDate(-1); fetchData()"
          class="px-4 py-2 text-sm font-medium hover:bg-gray-100 transition-colors">◀ Yesterday</button>
        <button @click="selectedDate = getDate(0); fetchData()"
          class="px-4 py-2 text-sm font-medium hover:bg-gray-100 transition-colors border-x border-tackroom-taupe">Today</button>
        <button @click="selectedDate = getDate(1); fetchData()"
          class="px-4 py-2 text-sm font-medium hover:bg-gray-100 transition-colors">Tomorrow ▶</button>
      </div>
    </div>

    <!-- Loading -->
    <template x-if="loading">
      <div class="flex justify-center py-16">
        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-turf-green"></div>
      </div>
    </template>

    <!-- Courses Accordion -->
    <template x-for="(courseData, index) in raceData" :key="index">
      <div class="bg-white rounded-lg border border-tackroom-taupe overflow-hidden mb-4">
        <button @click="courseData.open = !courseData.open"
          class="w-full px-4 py-3 flex justify-between items-center bg-turf-green text-white touch-target">
          <div class="text-left">
            <span class="font-heading font-bold text-lg" x-text="courseData.Course"></span>
            <span class="text-xs opacity-80 block" x-text="courseData.races.length + ' races'"></span>
          </div>
          <svg class="w-5 h-5 transition-transform" :class="{'rotate-180': courseData.open}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </button>
        <div x-show="courseData.open" x-collapse>
          <div class="px-4 py-2 text-xs text-paddock-grey border-b border-tackroom-taupe/30">
            Going: <span class="font-semibold text-odds-black" x-text="courseData.going"></span>
          </div>
          <template x-for="race in courseData.races" :key="race.timeDisplay">
            <a :href="`/racecards/view?date=${selectedDate}&course=${courseData.Course}&time=${race.timeDisplay}`"
              class="flex items-center justify-between px-4 py-3 border-b border-tackroom-taupe/20 hover:bg-turf-green/5 touch-target">
              <div class="flex items-center gap-3">
                <span class="font-bold text-turf-green text-sm w-14" x-text="race.timeDisplay"></span>
                <div>
                  <span class="text-sm text-odds-black font-medium" x-text="race.raceTitle"></span>
                  <div class="text-xs text-paddock-grey">
                    <span x-text="race.raceDistance"></span>
                    <span x-show="race.raceConditions"> · </span>
                    <span x-text="race.raceConditions"></span>
                  </div>
                </div>
              </div>
              <span class="text-xs text-paddock-grey whitespace-nowrap" x-text="race.noOfRunners + ' runners'"></span>
            </a>
          </template>
        </div>
      </div>
    </template>
  </section>

  <!-- Sidebar -->
  <aside class="hidden lg:block">
    <div class="bg-white rounded-lg border border-tackroom-taupe p-6 sticky top-20">
      <h2 class="font-heading font-bold text-lg text-odds-black mb-4 border-b border-tackroom-taupe pb-2">Browse</h2>
      <p class="text-sm text-paddock-grey mb-4">Select a date above to browse racecards from the archive.</p>
      <div class="space-y-2 text-sm">
        <a href="/racecards/festival/" class="block text-turf-green hover:text-turf-green/80 font-medium">🏆 Cheltenham Festival →</a>
      </div>
    </div>
  </aside>
</div>

<script src="/js/racecard-loader.js" defer></script>
{{ end }}
