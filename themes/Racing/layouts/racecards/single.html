{{ define "main" }}
<div x-data="singleRaceLoader()" x-init="init()">
  <a href="/" class="inline-flex items-center text-sm text-turf-green hover:text-turf-green/80 mb-6">
    ← Back to Today's Racing
  </a>

  <template x-if="!racecardData">
    <div class="flex flex-col items-center justify-center py-20">
      <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-turf-green mb-4"></div>
      <p class="text-paddock-grey text-sm">Loading racecard...</p>
    </div>
  </template>

  <template x-if="racecardData">
    <div>
      <!-- Race Header Card -->
      <div class="bg-white rounded-lg border border-tackroom-taupe overflow-hidden mb-6">
        <div class="bg-turf-green px-6 py-5 text-white">
          <div class="flex flex-col md:flex-row md:justify-between md:items-end gap-2">
            <div>
              <h1 class="text-2xl md:text-3xl font-heading font-bold" x-text="courseData?.Course"></h1>
              <p class="text-sm md:text-base mt-1 opacity-90" x-text="racecardData.raceTitle"></p>
            </div>
            <div class="text-sm">
              <span class="font-bold text-cheltenham-gold" x-text="racecardData.timeDisplay"></span>
            </div>
          </div>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 px-6 py-4 text-sm">
          <div>
            <span class="text-paddock-grey text-xs uppercase">Distance</span>
            <p class="font-semibold" x-text="racecardData.raceDistance"></p>
          </div>
          <div>
            <span class="text-paddock-grey text-xs uppercase">Conditions</span>
            <p class="font-semibold" x-text="racecardData.raceConditions"></p>
          </div>
          <div>
            <span class="text-paddock-grey text-xs uppercase">Runners</span>
            <p class="font-semibold" x-text="racecardData.noOfRunners"></p>
          </div>
          <div>
            <span class="text-paddock-grey text-xs uppercase">Prize</span>
            <p class="font-semibold" x-text="racecardData.prizemoney"></p>
          </div>
        </div>
        <div class="px-6 py-3 bg-racecard-white border-t border-tackroom-taupe text-sm">
          <span class="text-paddock-grey uppercase text-xs">Going:</span>
          <span class="font-semibold ml-2" x-text="courseData?.going"></span>
        </div>
      </div>

      <!-- Desktop: Racecard Table -->
      <div class="hidden md:block bg-white rounded-lg border border-tackroom-taupe overflow-hidden">
        <table class="racecard-table w-full">
          <thead>
            <tr>
              <th class="text-left">No.</th>
              <th class="text-left">Horse</th>
              <th class="text-center">Age</th>
              <th class="text-center">OR/Wgt</th>
              <th class="text-left">Jockey/Trainer</th>
              <th class="text-center">RPR/TS</th>
              <th class="text-center">Best RPR/VDW</th>
              <th class="text-center">Pred</th>
              <th class="text-right">Odds</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="horse in racecardData.horses" :key="horse['Horse.Number']">
              <tr :class="horse['pred.position'] === 1 ? 'bg-turf-green/5' : ''">
                <td class="text-center font-bold">
                  <span x-text="horse['Horse.Number']"></span>
                </td>
                <td>
                  <div class="flex items-center gap-2">
                    <img :src="horse['url.silk']" alt="" class="h-6 w-6 object-contain" @error="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2218%22 font-size=%2218%22>🐴</text></svg>'">
                    <div>
                      <span class="font-semibold" x-text="horse.Name"></span>
                      <template x-if="horse['pred.position'] === 1">
                        <span class="badge-top-tip ml-1">🏆 TOP TIP</span>
                      </template>
                    </div>
                  </div>
                </td>
                <td class="text-center" x-text="horse.Age"></td>
                <td class="text-center">
                  <span x-text="horse.OR"></span>/<span x-text="horse.Weight"></span>
                </td>
                <td>
                  <span class="text-xs" x-text="horse.Jockey"></span>
                  <span class="text-xs text-paddock-grey"> / </span>
                  <span class="text-xs" x-text="horse.Trainer"></span>
                </td>
                <td class="text-center">
                  <span x-text="horse.rpRating"></span>/<span x-text="horse.lastSpeed"></span>
                </td>
                <td class="text-center">
                  <span x-text="horse['best.RPR']"></span>
                </td>
                <td class="text-center">
                  <span class="font-bold" :class="horse['pred.position'] === 1 ? 'text-turf-green' : ''" x-text="horse['pred.position']"></span>
                </td>
                <td class="text-right">
                  <span class="inline-block bg-turf-green text-white font-bold text-sm px-3 py-1 rounded" x-text="horse.Odds"></span>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <!-- Mobile: Horse Cards -->
      <div class="block md:hidden space-y-3">
        <template x-for="horse in racecardData.horses" :key="horse['Horse.Number']">
          <div class="bg-white rounded-lg border border-tackroom-taupe overflow-hidden">
            <div class="flex p-4 gap-3">
              <img :src="horse['url.silk']" alt="" class="h-10 w-10 object-contain" @error="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2218%22 font-size=%2218%22>🐴</text></svg>'">
              <div class="flex-grow min-w-0">
                <div class="flex items-center gap-2 mb-1">
                  <span class="text-xs text-paddock-grey" x-text="horse['Horse.Number'] + '.'"></span>
                  <span class="font-bold text-odds-black" x-text="horse.Name"></span>
                  <template x-if="horse['pred.position'] === 1">
                    <span class="badge-top-tip">🏆 TOP TIP</span>
                  </template>
                </div>
                <div class="grid grid-cols-2 gap-x-4 gap-y-1 text-xs text-paddock-grey">
                  <div>Age: <span class="text-odds-black" x-text="horse.Age"></span></div>
                  <div>OR: <span class="text-odds-black" x-text="horse.OR"></span>/<span class="text-odds-black" x-text="horse.Weight"></span></div>
                  <div class="col-span-2">Jockey: <span class="text-odds-black" x-text="horse.Jockey"></span></div>
                  <div class="col-span-2">Trainer: <span class="text-odds-black" x-text="horse.Trainer"></span></div>
                  <div>RPR: <span class="text-odds-black" x-text="horse.rpRating"></span></div>
                  <div>Pred: <span class="font-bold text-turf-green" x-text="horse['pred.position']"></span></div>
                </div>
              </div>
              <div class="bg-turf-green text-white font-bold px-3 py-2 rounded text-sm self-start" x-text="horse.Odds"></div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </template>
</div>

<script src="/js/racecard-loader.js" defer></script>
{{ end }}
